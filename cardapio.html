<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio – Boteco Bangu</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { wine: '#7b1113', gold: '#facc15', 'deep-red': '#4a0404' },
                    fontFamily: { paytone: ['Paytone One', 'sans-serif'], montserrat: ['Montserrat', 'sans-serif'], inter: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        :root { --logo-bar: 4.5rem; --menu-bg: #3b0607; --menu-gold: #facc15; }
        .cardapio-bg { background: var(--menu-bg); }
        .logo-bar { position: sticky; top: 0; z-index: 60; height: var(--logo-bar); background: #7b1113; }
        .menu-hero {
            background: linear-gradient(90deg, rgba(23, 3, 2, .76), rgba(23, 3, 2, .28)), url('assets/img/04.png') center 48% / cover;
            display: flex;
            align-items: center;
            min-height: 9rem;
            padding: 1.5rem clamp(1.25rem, 5.5vw, 5rem);
        }
        .menu-hero h1 { font-size: clamp(2.2rem, 7vw, 4.35rem); line-height: 1; }
        .menu-nav { position: sticky; top: var(--logo-bar); z-index: 50; background: var(--menu-bg); }
        .master-btn, .shortcut-pill {
            color: #e1babb;
            background: #501113;
            border: 1px solid #833638;
            transition: background-color .2s, color .2s, border-color .2s;
        }
        .master-btn.active { background: var(--menu-gold); border-color: var(--menu-gold); color: var(--menu-bg); }
        .shortcut-pill { flex: none; white-space: nowrap; font-size: .75rem; padding: .55rem .9rem; border-radius: 999px; font-weight: 700; text-transform: uppercase; }
        .shortcut-pill.active { background: var(--menu-bg); border-color: var(--menu-gold); color: var(--menu-gold); }
        #shortcut-container { scrollbar-width: thin; scrollbar-color: #833638 transparent; }
        .menu-heading { font-size: clamp(1.6rem, 3.6vw, 2.8rem); line-height: 1.12; }
        .menu-item-row { border-bottom: 1px solid #79413b; }
        .menu-item-name { font-size: 1.1875rem; font-family: Antonio, sans-serif; font-weight: 600; line-height: 1.23; }
        .menu-item-name button { text-transform: uppercase; }
        .menu-item-description { font-size: .875rem; line-height: 1.45; }
        .menu-variation, .menu-item-price { font-size: 1rem; line-height: 1.4; }
        .menu-item-price { font-variant-numeric: tabular-nums; }
        .menu-item-row:hover { background-color: rgba(255,255,255,.035); }
        .menu-item-row:focus-within, .master-btn:focus-visible, .shortcut-pill:focus-visible { outline: 2px solid var(--menu-gold); outline-offset: -2px; }
        .menu-variation + .menu-variation { border-top: 1px solid #713433; }
        .item-unavailable { opacity: .68; }
        .badge-schedule { color: var(--menu-gold); border: 1px solid #835d28; font-size: .65rem; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }

        @media (min-width: 768px) {
            :root { --logo-bar: 5rem; }
            .menu-hero { justify-content: center; min-height: 9.5rem; text-align: center; }
            .menu-heading { width: fit-content; }
            .menu-item-name { font-size: 1.375rem; }
        }

        @keyframes modalShow { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .modal-content { animation: modalShow 0.3s ease; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>

    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@600&family=Inter:wght@400;700&family=Montserrat:wght@400;700;900&family=Paytone+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-menu.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V54PKFDRCZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-V54PKFDRCZ');
    </script>
</head>

<body class="text-gray-100 cardapio-bg min-h-screen font-inter pb-20">

    <nav id="logo-bar" class="logo-bar flex items-center px-5 md:px-8" aria-label="Boteco Bangu">
        <a href="/"><img src="assets/img/Logo_logo-site.png" alt="Boteco Bangu" class="h-14 md:h-[4.25rem]"></a>
    </nav>

    <header class="menu-hero">
        <h1 class="font-paytone uppercase text-gold max-w-[9ch] md:max-w-none">Nosso Cardápio</h1>
    </header>

    <nav id="menu-nav" class="menu-nav pt-3 pb-2" aria-label="Navegação do cardápio">
        <div class="mx-auto px-5 flex gap-2 max-w-2xl">
            <button type="button" onclick="setMasterFilter('comidas')" id="btn-comidas" aria-pressed="true" class="master-btn active flex-1 py-3 rounded-2xl font-bold uppercase text-sm md:text-base">
                Comidas
            </button>
            <button type="button" onclick="setMasterFilter('bebidas')" id="btn-bebidas" aria-pressed="false" class="master-btn flex-1 py-3 rounded-2xl font-bold uppercase text-sm md:text-base">
                <i class="fas fa-glass-cheers mr-1" aria-hidden="true"></i> Bebidas
            </button>
        </div>
        <div id="shortcut-container" class="mx-auto max-w-7xl px-5 mt-2 pt-1 pb-2 overflow-x-auto flex gap-2 md:flex-wrap md:justify-center"></div>
    </nav>

    <main class="mx-auto max-w-[90rem] py-5 md:py-7 px-5 md:px-[6%]">
        <div id="menu-container" class="space-y-10"></div>
    </main>

    <!-- Modal Detalhes -->
    <div id="detail-modal" class="fixed inset-0 z-[110] bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="modal-content glass w-full max-w-lg max-h-full rounded-3xl overflow-y-auto relative">
            <button onclick="closeDetail()" class="absolute top-4 right-4 z-20 bg-black/50 text-white w-10 h-10 rounded-full flex items-center justify-center"><i class="fas fa-times text-xl"></i></button>
            <div id="modal-image-container" class="w-full h-64 md:h-80 p-4 overflow-hidden bg-white/5"><img id="modal-img" src="" class="w-full h-full object-contain"></div>
            <div class="p-8">
                <div id="modal-badge-container" class="mb-4"></div>
                <div class="space-y-2 mb-4 pr-5">
                    <h2 id="modal-title" class="text-2xl font-paytone text-gold uppercase"></h2>
                    <div id="modal-price" class="text-2xl font-bold text-white font-montserrat"></div>
                </div>
                <p id="modal-desc" class="text-gray-300 text-sm md:text-base font-montserrat leading-relaxed mb-6"></p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>

        let allItems = [];
        let categoryOrder = [];
        let currentMaster = 'comidas';
        let precosFestivosAtivos = false;
        const BEBIDAS_CATEGORIES = ["Bebidas sem Álcool", "Nossos Drinks", "Cervejas", "Chopps", "Carta de Vinhos", "Vinhos", "Long Neck", "Doses", "Gin", "Whisky", "Vodka", "Doses e Destilados"];
        let activeCategory;

        async function init() { window.AOS?.init({ duration: 800, once: true }); await loadMenu(); }

        async function loadMenu() {
            try {
                const menu = await connectFirebaseMenu();
                allItems = (await menu.items(true)).sort((a, b) => a.preco - b.preco);
                const settings = await menu.config('precos_festivos_ativos');
                precosFestivosAtivos = settings?.valor_booleano === true;
                const categories = await menu.config('categoria_ordem');
                if (Array.isArray(categories?.ordem)) categoryOrder = categories.ordem;
            } catch (error) {
                console.error('Erro ao carregar cardápio:', error);
                const message = document.createElement('p');
                message.className = 'text-center py-8';
                message.textContent = 'Não foi possível carregar o cardápio. Atualize a página para tentar novamente.';
                document.querySelector('main')?.prepend(message);
            }

            renderMenu();
        }

        function setMasterFilter(type) {
            currentMaster = type;
            document.querySelectorAll('.master-btn').forEach(button => {
                const selected = button.id === `btn-${type}`;
                button.classList.toggle('active', selected);
                button.setAttribute('aria-pressed', String(selected));
            });
            renderMenu();
            const logoBar = document.getElementById('logo-bar');
            const nav = document.getElementById('menu-nav');
            if (nav.getBoundingClientRect().top <= logoBar.offsetHeight) {
                const first = document.querySelector('.menu-section');
                if (first) scrollToSection(first.id);
            }
        }

        function scrollToSection(id) {
            const section = document.getElementById(id);
            if (!section) return;
            const offset = document.getElementById('logo-bar').offsetHeight +
                document.getElementById('menu-nav').offsetHeight + 8;
            window.scrollTo({ top: section.getBoundingClientRect().top + window.scrollY - offset, behavior: 'smooth' });
        }

        function escapeMenuText(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function menuPrice(option) {
            const price = precosFestivosAtivos ? option.preco_especial ?? option.preco : option.preco;
            return Number(price).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function renderMenuPrices(item) {
            if (!Array.isArray(item.variacoes) || !item.variacoes.length) return '';
            const prices = document.createElement('dl');
            prices.className = 'mt-2';
            for (const option of item.variacoes) {
                const row = document.createElement('div');
                row.className = 'menu-variation flex items-baseline justify-between gap-3 py-2';
                const label = document.createElement('dt');
                label.className = 'min-w-0 break-words text-white';
                label.textContent = option.nome;
                const price = document.createElement('dd');
                price.className = 'menu-item-price shrink-0 whitespace-nowrap font-bold text-gold';
                price.textContent = menuPrice(option);
                row.append(label, price);
                prices.append(row);
            }
            return prices.outerHTML;
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            const shortcutContainer = document.getElementById('shortcut-container');
            const day = new Date().getDay();
            const time = new Date().getHours() * 60 + new Date().getMinutes();

            const presentCats = [...new Set(allItems.map(i => i.categoria))].filter(Boolean);

            // Separa comidas de bebidas dinamicamente (lista de bebidas é pequena e estável)
            let targetCats;
            if (currentMaster === 'comidas') {
                targetCats = presentCats.filter(c => !BEBIDAS_CATEGORIES.includes(c));
            } else {
                targetCats = presentCats.filter(c => BEBIDAS_CATEGORIES.includes(c));
            }

            // Ordena categorias dinamicamente pela menor 'ordem' dos pratos dentro de cada uma
            const rank = category => categoryOrder.includes(category) ? categoryOrder.indexOf(category) : Infinity;
            targetCats.sort((a, b) => {
                if (rank(a) !== rank(b)) return rank(a) - rank(b);
                const minA = Math.min(...allItems.filter(i => i.categoria === a).map(i => i.ordem ?? 9999));
                const minB = Math.min(...allItems.filter(i => i.categoria === b).map(i => i.ordem ?? 9999));
                return minA - minB;
            });

            const DIAS_NOMES = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

            const groups = targetCats.map((cat, index) => {
                const items = allItems.filter(i => i.categoria === cat).map(i => {
                    let av = true;
                    if (i.dias_semana && !i.dias_semana.includes(day)) av = false;
                    if (av && i.hora_inicio && i.hora_fim) {
                        const [hS, mS] = i.hora_inicio.split(':').map(Number);
                        const [hE, mE] = i.hora_fim.split(':').map(Number);
                        if (time < (hS*60+mS) || time > (hE*60+mE)) av = false;
                    }

                    // Monta texto de disponibilidade para exibir no card
                    let scheduleLabel = '';
                    if (i.dias_semana && i.dias_semana.length > 0) {
                        scheduleLabel += i.dias_semana.map(d => DIAS_NOMES[d]).join(', ');
                    }
                    if (i.hora_inicio && i.hora_fim) {
                        const fmt = h => h.substring(0,5);
                        scheduleLabel += (scheduleLabel ? ' • ' : '') + fmt(i.hora_inicio) + ' – ' + fmt(i.hora_fim);
                    }

                    return { ...i, isNow: av, scheduleLabel };
                });
                return { name: cat, id: `sec-${currentMaster}-${index}`, items };
            }).filter(g => g.items.length > 0);

            shortcutContainer.innerHTML = groups.map(g => `<button type="button" id="pill-${g.id}" onclick="scrollToSection('${g.id}')" class="shortcut-pill">${escapeMenuText(g.name)}</button>`).join('');

            container.innerHTML = groups.map(g => `
                <section id="${g.id}" class="menu-section">
                    <h2 class="menu-heading font-paytone text-gold uppercase border-b-2 border-gold pb-2 mb-1 md:mb-2">${escapeMenuText(g.name)}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-[6%]">
                        ${g.items.map(item => {
                            const variationPrices = renderMenuPrices(item);
                            return `
                                <article class="menu-item-row relative flex items-start gap-3 py-4 md:py-5 ${item.isNow ? '' : 'item-unavailable'}">
                                    ${item.imagem_url ? `<img src="${escapeMenuText(item.imagem_url)}" alt="" loading="lazy" class="h-14 w-14 md:h-16 md:w-16 shrink-0 rounded object-cover">` : ''}
                                    <div class="min-w-0 flex-1">
                                        <div class="flex items-start justify-between gap-3">
                                            <h3 class="menu-item-name min-w-0 break-words text-white">
                                                <button type="button" data-item-id="${escapeMenuText(item.id)}" class="text-left after:absolute after:inset-0">${escapeMenuText(item.nome)}</button>
                                            </h3>
                                            ${variationPrices ? '' : `<span class="menu-item-price text-gold font-bold whitespace-nowrap shrink-0">${menuPrice(item)}</span>`}
                                        </div>
                                        ${item.descricao ? `<p class="menu-item-description text-[#e6c5c2] mt-1.5">${escapeMenuText(item.descricao)}</p>` : ''}
                                        ${variationPrices}
                                        ${item.scheduleLabel ? `<span class="badge-schedule mt-2"><i class="fas fa-clock" aria-hidden="true"></i>${escapeMenuText(item.scheduleLabel)}</span>` : ''}
                                        ${!item.isNow ? '<p class="text-xs text-red-300 font-bold mt-1">Indisponível agora</p>' : ''}
                                    </div>
                                </article>
                            `;
                        }).join('')}
                    </div>
                </section>
            `).join('');
            activeCategory = undefined;
            updateCategoryHighlight();
        }

        // Modal Logic
        function openDetail(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) return;

            const modalImg = document.getElementById('modal-img');
            const imgContainer = document.getElementById('modal-image-container');

            if (item.imagem_url && item.imagem_url.length > 10) {
                modalImg.src = item.imagem_url;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.style.display = 'none';
            }

            document.getElementById('modal-title').innerText = item.nome;
            const prices = document.getElementById('modal-price');
            const variationPrices = renderMenuPrices(item);
            if (variationPrices) prices.innerHTML = variationPrices;
            else prices.textContent = menuPrice(item);
            document.getElementById('modal-desc').innerText = item.descricao || '';
            
            const badge = document.getElementById('modal-badge-container');
            badge.innerHTML = item.dias_semana ? `<div class="badge-schedule"><i class="fas fa-clock"></i> Disponibilidade Agendada</div>` : '';

            document.getElementById('detail-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() { document.getElementById('detail-modal').classList.add('hidden'); document.body.style.overflow = 'auto'; }

        function updateCategoryHighlight() {
            const sections = [...document.querySelectorAll('.menu-section')];
            if (!sections.length) return;
            const boundary = document.getElementById('menu-nav').getBoundingClientRect().bottom + 12;
            const current = sections.filter(section => section.getBoundingClientRect().top <= boundary).at(-1) ?? sections[0];
            if (current.id === activeCategory) return;
            const previous = document.getElementById('pill-' + activeCategory);
            previous?.classList.remove('active');
            previous?.removeAttribute('aria-current');
            activeCategory = current.id;
            const pill = document.getElementById('pill-' + current.id);
            pill.classList.add('active');
            pill.setAttribute('aria-current', 'true');
            const rail = document.getElementById('shortcut-container');
            if (rail.scrollWidth > rail.clientWidth) {
                rail.scrollBy({ left: pill.getBoundingClientRect().left - rail.getBoundingClientRect().left -
                    (rail.clientWidth - pill.offsetWidth) / 2, behavior: 'smooth' });
            }
        }

        window.addEventListener('scroll', updateCategoryHighlight, { passive: true });
        window.addEventListener('resize', updateCategoryHighlight);
        document.getElementById('menu-container').addEventListener('click', event => {
            const itemButton = event.target.closest('[data-item-id]');
            if (itemButton) openDetail(Number(itemButton.dataset.itemId));
        });

        init();
    </script>
</body>
</html>
